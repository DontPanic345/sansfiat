name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prototype: [merge4, hex-economy, hex4x, scout, supply-lines]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: ${{ matrix.prototype }}

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test relay/*.test.mjs

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: ./build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: engine-www
          path: engine/www

  pages:
    if: github.ref == 'refs/heads/main'
    needs: [js, engine]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-www
          path: _site/engine
      - run: |
          for d in merge4 hex-economy hex4x scout supply-lines paint-army; do cp -r "$d" "_site/$d"; done
          {
            echo '<!doctype html><meta charset="utf-8"><title>Sans Fiat</title><h1>Sans Fiat prototypes</h1><ul>'
            for d in engine merge4 hex-economy hex4x scout supply-lines paint-army; do echo "<li><a href=\"$d/\">$d</a></li>"; done
            echo '<li><a href="merge4/docs/guide.html">merge4 guide</a></li></ul>'
          } > _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
