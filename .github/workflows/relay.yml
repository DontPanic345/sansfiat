name: relay

# Runs the Relay crew (relay/relay.mjs): one `claude -p` session per step, until the budget,
# the deadline or the work runs out. See relay/README.md.
#
# Start a run: Actions → relay → Run workflow, or comment `/relay run` on a piece.
# Stop now: cancel the run; the step stays open and the next run starts it again.
# Runs every six hours on the schedule below; comment it out to turn it off. A run that stops
# on the 5-hour window starts a `wait` run, which sleeps until the window resets and then
# starts a crew run.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "run; status to print the next step and the pacing without running anything; wait to start a run at `until`"
        type: choice
        options: [run, status, wait]
        default: run
      until:
        description: "for wait: when to start the run, as an ISO time"
        required: false

permissions:
  contents: read # the crew writes with the sansfiat-relay App's token, not this one
  actions: write # a budget stop starts a wait run, and a wait run starts a crew run

jobs:
  # Outside the crew's concurrency group, so a reply or `/relay run` isn't queued behind it.
  wait:
    if: inputs.command == 'wait'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Sleep until the window resets
        env:
          UNTIL: ${{ inputs.until }}
        run: |
          secs=$(( $(date -d "$UNTIL" +%s) - $(date +%s) + 120 ))
          if [ "$secs" -gt 0 ]; then sleep "$secs"; fi
      - name: Start a crew run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run relay.yml --repo "${{ github.repository }}" --ref main -f command=run

  relay:
    if: inputs.command != 'wait'
    concurrency:
      group: relay
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 345
    environment: relay
    env:
      RELAY_APP_ID: ${{ secrets.RELAY_APP_ID }}
      RELAY_APP_KEY: ${{ secrets.RELAY_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      RELAY_BOARD_TOKEN: ${{ secrets.RELAY_BOARD_TOKEN }}
      DISPATCH_TOKEN: ${{ github.token }}
    steps:
      # The crew sets up git's credentials itself, from a token file sessions can read
      # without holding the App's key.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The latest, every run. The crew records the version on each step, and a session whose
      # stream-json it can't read stops the run without costing the step an attempt.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Status
        if: inputs.command == 'status'
        run: node relay/relay.mjs status

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.command != 'status'
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: inputs.command != 'status'
        with:
          workspaces: engine

      - uses: taiki-e/install-action@v2
        if: inputs.command != 'status'
        with:
          tool: wasm-bindgen-cli@0.2.128

      - name: Run the crew
        if: inputs.command != 'status'
        run: node relay/relay.mjs run

      # A cancelled or timed-out job never reaches the crew's own crash report.
      - name: Report a run that didn't finish
        if: failure() || cancelled()
        run: node relay/relay.mjs report "Relay run ${{ github.run_id }} ended ${{ job.status }} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/upload-artifact@v4
        if: always() && inputs.command != 'status'
        with:
          name: relay-runs-${{ github.run_id }}
          path: relay/runs/
          retention-days: 14
