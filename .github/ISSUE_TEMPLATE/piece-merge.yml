name: Piece – merge
description: Bring one proven mechanic into the game, land it, and archive the prototype it drew on.
title: "Merge: "
labels: ["kind:piece", "type:merge"]
body:
  - type: input
    id: source
    attributes:
      label: Source
      description: The proof's branch or PR, or the prototype folder, that this merge brings in. One only.
    validations:
      required: true
  - type: input
    id: design
    attributes:
      label: Design file
      description: The file in docs/design/ this builds.
      placeholder: docs/design/
    validations:
      required: true
  - type: textarea
    id: in-scope
    attributes:
      label: In scope
      description: What this piece builds. Anything not listed here is out of scope.
      value: "- "
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this piece must not touch, even if it seems related.
      value: "- "
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: Pieces or merges that must land first, as issue links. Leave blank if none.
