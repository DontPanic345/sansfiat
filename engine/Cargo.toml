[workspace]
members = ["core", "cli", "web"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
engine = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 3
