<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sans Fiat</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#12161c; --panel:#1a2029; --ink:#e6edf3; --dim:#8b98a8; --line:#2a3340; --accent:#6cb6ff; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body { background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,sans-serif; display:flex; flex-direction:column; }
  button, select, input, summary { font:inherit; }
  button, select { background:#24303d; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:3px 9px; cursor:pointer; }
  button:hover, select:hover { background:#2e3c4c; }
  button[aria-pressed="true"] { background:#34506e; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  input[type=number] { width:76px; background:#0b0e12; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:3px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  label { color:var(--dim); font-size:12px; }
  .dim { color:var(--dim); font-size:12px; }

  #bar { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  #bar .group { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; }
  #bar h1 { font-size:15px; margin:0; }
  .stat { display:flex; flex-direction:column; line-height:1.15; }
  .stat b { font-size:14px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
  #phase { max-width:300px; }
  .controls { margin-left:auto; }
  .menu { position:relative; }
  .menu > summary { list-style:none; cursor:pointer; background:#24303d; border:1px solid var(--line); border-radius:4px; padding:3px 9px; }
  .menu > summary::-webkit-details-marker { display:none; }
  .menu[open] > summary { border-color:var(--accent); }
  .menu .pop { position:absolute; right:0; top:calc(100% + 4px); z-index:20; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; display:flex; flex-direction:column; gap:6px; min-width:190px; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  .menu .pop label { color:var(--ink); font-size:13px; }

  #main { flex:1; min-height:0; display:flex; }
  #mapbox { position:relative; flex:1; min-width:0; background:#0b0e12; overflow:hidden; }
  #map { position:absolute; inset:0; display:block; cursor:grab; }
  #map:active { cursor:grabbing; }
  #zoom { position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:4px; }
  #zoom button { width:34px; padding:3px 0; font-size:16px; }
  #zoom #fit { font-size:12px; }
  #showfeed { position:absolute; right:10px; bottom:10px; }
  #error { position:absolute; left:10px; top:10px; margin:0; color:#ff8a80; background:rgba(0,0,0,.6); padding:2px 8px; border-radius:4px; }
  #error:empty { display:none; }
  #hint { position:absolute; left:10px; top:10px; color:var(--dim); font-size:11px; pointer-events:none; }

  #legend { position:absolute; left:10px; bottom:10px; background:rgba(18,22,28,.92); border:1px solid var(--line); border-radius:6px; padding:4px 8px; max-width:calc(100% - 20px); }
  #legend summary { cursor:pointer; font-size:12px; color:var(--dim); }
  #legend .items { display:grid; grid-template-columns:repeat(4,auto); gap:3px 14px; margin-top:6px; font-size:12px; }
  #legend .item { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  #legend i { display:inline-block; width:18px; height:14px; border-radius:2px; border:1px solid rgba(0,0,0,.4); flex:none; }

  #tip { position:fixed; z-index:30; pointer-events:none; background:rgba(14,18,24,.96); border:1px solid #3a4656; border-radius:6px; padding:6px 9px; font-size:12px; max-width:240px; box-shadow:0 4px 14px rgba(0,0,0,.5); }
  #tip[hidden] { display:none; }
  #tip b { font-size:13px; }

  #side { width:340px; max-width:45vw; flex:none; display:flex; flex-direction:column; background:var(--panel); border-left:1px solid var(--line); min-height:0; }
  #side.collapsed { display:none; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.5); vertical-align:-1px; margin-right:5px; }
  #civbar { gap:6px 12px; align-items:center; padding-left:14px; border-left:1px solid var(--line); }
  #civbar[hidden], #civbar [hidden] { display:none; }
  #civbar > b { font-size:14px; }
  #civbar .stat em { font-style:normal; text-transform:none; }
  #civbar .stat[title] { cursor:help; }

  #pick { position:absolute; left:10px; top:44px; width:min(380px, calc(100% - 20px)); max-height:calc(100% - 56px); overflow:auto; background:rgba(18,22,28,.96); border:1px solid var(--accent); border-radius:8px; padding:8px 12px 12px; box-shadow:0 8px 28px rgba(0,0,0,.6); z-index:5; }
  #pick[hidden] { display:none; }
  #pick h2 { margin:0 0 6px; font-size:16px; }
  #pick .card { border-top:1px solid var(--line); padding:7px 0; }
  #pick .card .head { font-size:14px; }
  #pick .buttons { display:flex; gap:8px; margin-top:6px; }
  #pick > .buttons { border-top:1px solid var(--line); padding-top:8px; }
  button.link { background:none; border:0; padding:0 8px 0 0; color:var(--accent); text-decoration:underline; }
  button.link:hover { background:none; }
  #detail .actions { margin-top:8px; display:flex; flex-direction:column; gap:4px; }
  #detail .units { margin:6px 0; }

  #detail { max-height:46%; overflow:auto; padding:8px 12px; border-bottom:1px solid var(--line); flex:none; }
  #detail:empty { display:none; }
  #detail h2 { font-size:14px; margin:0 0 4px; display:flex; justify-content:space-between; align-items:center; }
  #detail p { margin:4px 0; }
  #detail table { border-collapse:collapse; font-size:12px; } #detail td { padding:0 8px 0 0; }
  #feedhead { display:flex; justify-content:space-between; align-items:center; padding:6px 12px 2px; }
  #feedhead h2 { margin:0; font-size:14px; }
  #filters { display:flex; flex-wrap:wrap; gap:2px 10px; padding:4px 12px; }
  #filters label { color:var(--ink); }
  #feed { list-style:none; margin:0; padding:0; overflow:auto; flex:1; min-height:0; }
  #feed li button { display:flex; gap:6px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid #222a35; border-radius:0; padding:3px 12px; font-size:12px; align-items:baseline; }
  #feed li button:hover { background:#222c38; }
  #feed li.selected button { background:#2b3a4d; }
  #feed .turn { color:var(--dim); min-width:38px; text-align:right; font-variant-numeric:tabular-nums; flex:none; }
  #feed .icon { width:14px; text-align:center; flex:none; font-weight:bold; }
  #feed .text { flex:1; }

  @media (max-width:760px) { #side { position:absolute; right:0; top:0; bottom:0; width:80vw; z-index:10; } #legend .items { grid-template-columns:repeat(2,auto); } }
</style>
</head>
<body>
<header id="bar">
  <div class="group">
    <h1>Sans Fiat</h1>
    <div class="stat"><b id="turn">0</b><span>Turn</span></div>
    <div class="stat" id="phase"><b id="phasetext">Pre-game</b><span id="phasenote">Phase</span></div>
    <div class="stat"><b id="people">0</b><span>People</span></div>
    <div class="stat"><b id="clans">0</b><span>Clans</span></div>
    <div class="stat"><b id="markets">0</b><span>Markets</span></div>
    <div class="stat"><b id="hearths">0</b><span>Hearths</span></div>
    <div class="stat"><b id="centres">0 / 3</b><span>Centres</span></div>
  </div>
  <div class="group" id="civbar" hidden>
    <span><i class="sw" id="civsw"></i><b id="civname"></b></span>
    <span class="group" id="civstats">
      <div class="stat"><b id="civpeople">0</b><span>People <em id="civinunits"></em></span></div>
      <div class="stat" id="st-store"><b id="civstore">0 / 50</b><span>Store</span></div>
      <div class="stat"><b id="civunits">0</b><span>Units</span></div>
    </span>
  </div>
  <div class="group controls">
    <button id="end" type="button">End turn</button>
    <button id="play" type="button" aria-pressed="false">Play</button>
    <label>Speed
      <select id="speed">
        <option value="slow">slow (1/s)</option>
        <option value="normal" selected>normal (4/s)</option>
        <option value="fast">fast (20/s)</option>
        <option value="max">max</option>
      </select>
    </label>
    <button id="run" type="button">Run to end</button>
    <span class="group" role="group" aria-label="New map">
      <label>Size <select id="size"></select></label>
      <label>Seed <input id="seed" type="number" value="1" min="0" step="1"></label>
      <button id="dice" type="button" title="Random seed" aria-label="Random seed">🎲</button>
      <button id="new" type="button">New map</button>
    </span>
    <details class="menu" id="viewmenu">
      <summary>View</summary>
      <div class="pop">
        <label><input id="v-fertility" type="checkbox"> Fertility</label>
        <label><input id="v-territory" type="checkbox" checked> Territories</label>
        <label><input id="v-rounds" type="checkbox" checked> Rounds</label>
        <label><input id="v-markets" type="checkbox" checked> Markets</label>
        <label><input id="v-hidden" type="checkbox"> Hidden costs (debug)</label>
      </div>
    </details>
    <details class="menu" id="filemenu">
      <summary>Game</summary>
      <div class="pop">
        <button id="save" type="button">Save</button>
        <button id="loadButton" type="button">Load…</button>
        <input id="load" type="file" accept=".json,application/json" hidden aria-label="Load a saved game">
      </div>
    </details>
    <button id="feedtoggle" type="button" aria-pressed="true">Feed</button>
  </div>
</header>
<div id="main">
  <div id="mapbox">
    <canvas id="map" tabindex="0" aria-label="The map. Drag to pan, scroll to zoom; arrow keys pan, plus and minus zoom, 0 fits."></canvas>
    <div id="zoom" role="group" aria-label="Zoom">
      <button id="zin" type="button" aria-label="Zoom in">+</button>
      <button id="zout" type="button" aria-label="Zoom out">−</button>
      <button id="fit" type="button" aria-label="Fit the map to the window">fit</button>
    </div>
    <p id="error" role="alert"></p>
    <details id="legend" open>
      <summary>Legend</summary>
      <div class="items" id="legenditems"></div>
    </details>
    <button id="showfeed" type="button" hidden>Show feed</button>
    <div id="pick" role="dialog" aria-label="Choose your civ" hidden></div>
    <div id="tip" role="tooltip" hidden></div>
  </div>
  <aside id="side" aria-label="Details and events">
    <div id="detail"></div>
    <div id="feedhead"><h2>Events</h2><button id="hidefeed" type="button" aria-label="Collapse the feed">×</button></div>
    <details id="filterbox"><summary class="dim" style="padding:0 12px;cursor:pointer">Filter</summary><div id="filters"></div></details>
    <ul id="feed" aria-label="Events, newest first"></ul>
  </aside>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
