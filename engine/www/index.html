<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sans Fiat</title>
<style>
  :root { --bg:#12161c; --panel:#1a2029; --ink:#e6edf3; --dim:#8b98a8; --line:#2a3340; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,sans-serif; display:flex; gap:12px; padding:12px; flex-wrap:wrap; align-items:flex-start; }
  canvas { background:#0b0e12; border:1px solid var(--line); border-radius:6px; max-width:100%; }
  #side { width:360px; max-width:100%; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; }
  h1 { font-size:16px; margin:0 0 8px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  label { color:var(--dim); font-size:12px; }
  input[type=number] { width:56px; background:#0b0e12; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:3px; }
  button { background:#24303d; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:4px 10px; cursor:pointer; }
  .dim { color:var(--dim); font-size:12px; }
  #error { color:#ff8a80; }
</style>
</head>
<body>
<canvas id="map" width="720" height="640"></canvas>
<div id="side">
  <h1>Sans Fiat</h1>
  <div class="row">
    <label>seed <input id="seed" type="number" value="1"></label>
    <label>radius <input id="radius" type="number" value="8" min="2"></label>
    <button id="reset">New</button>
  </div>
  <div class="row">
    <button id="end">End turn</button>
    <button id="ten">+10</button>
    <button id="play">Play</button>
  </div>
  <div class="row">
    <button id="save">Save</button>
    <label><button id="loadButton">Load</button><input id="load" type="file" accept=".json,application/json" hidden></label>
  </div>
  <div id="info"></div>
  <p id="error"></p>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
