<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sans Fiat</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="screen-start" data-screen="start" aria-label="Start" hidden>
  <div class="start-card">
    <h1>Sans Fiat</h1>
    <p class="vision">A hex 4X with no money, set among the first civilisations.</p>
    <fieldset>
      <legend>New game</legend>
      <label>Size <select id="size"></select></label>
      <label>Seed <input id="seed" type="number" value="1" min="0" step="1"></label>
      <button id="dice" type="button" title="Random seed" aria-label="Random seed">🎲</button>
      <button id="newgame" type="button">Start</button>
    </fieldset>
    <div class="row">
      <button id="continue" type="button" disabled>Continue</button>
      <span id="continue-line" class="dim">No saved game</span>
    </div>
    <div class="row">
      <button id="start-loadButton" type="button">Load a file…</button>
      <input id="start-load" type="file" accept=".json,application/json" hidden aria-label="Load a saved game">
    </div>
    <p id="start-error" role="alert"></p>
  </div>
</section>

<section id="screen-play" data-screen="play" aria-label="Play" hidden>
  <header id="bar">
    <div class="stat" id="turnstat"><b id="turn">0</b><span id="turnlabel">Turn</span></div>
    <div class="group" id="counts">
      <div class="stat" id="phase"><b id="phasetext">Pre-game</b><span id="phasenote">Phase</span></div>
      <div class="stat" title="People in the world"><b id="people">0</b><span>People</span></div>
      <div class="stat" title="Clans in the world"><b id="clans">0</b><span>Clans</span></div>
      <div class="stat" title="Festivals in the world (markets in the rules)"><b id="festivals">0</b><span>Festivals</span></div>
      <div class="stat" title="Hearths: wild grain tamed into a food"><b id="hearths">0</b><span>Hearths</span></div>
      <div class="stat" title="Centres: festivals that count toward a win"><b id="centres">0 / 3</b><span>Centres</span></div>
    </div>
    <div class="group" id="chips" role="group" aria-label="Standing, by civ" hidden></div>
    <div class="controls">
      <button id="end" type="button" title="End the turn (space)">End turn</button>
      <button id="run" type="button" hidden>Skip to the pick</button>
      <button id="more" type="button" aria-expanded="false" aria-label="Menu">☰</button>
      <div class="more-items">
        <button id="play" type="button" aria-pressed="false" title="Run turns at the speed (space pauses)">Play</button>
        <label>Speed
          <select id="speed">
            <option value="slow">slow (1/s)</option>
            <option value="normal" selected>normal (4/s)</option>
            <option value="fast">fast (20/s)</option>
            <option value="max">max</option>
          </select>
        </label>
        <details class="menu" id="gamemenu">
          <summary>Game</summary>
          <div class="pop">
            <button id="menu-new" type="button">New game</button>
            <button id="save" type="button">Save to file</button>
            <button id="loadButton" type="button">Load a file…</button>
            <input id="load" type="file" accept=".json,application/json" hidden aria-label="Load a saved game">
            <button id="menu-standing" type="button">Standing so far</button>
            <p id="autosave-line" role="status"></p>
          </div>
        </details>
        <details class="menu" id="viewmenu">
          <summary>View</summary>
          <div class="pop">
            <label><input id="v-fields" type="checkbox" checked> Fields</label>
            <label><input id="v-territory" type="checkbox"> Territories</label>
            <label><input id="v-routes" type="checkbox"> Festival routes</label>
            <label><input id="v-country" type="checkbox"> Hidden country (H)</label>
            <label><input id="v-legend" type="checkbox" checked> Legend</label>
          </div>
        </details>
        <details class="menu" id="debugmenu">
          <summary>Debug</summary>
          <div class="pop">
            <label><input id="v-fertility" type="checkbox"> Fertility</label>
            <label><input id="v-hidden" type="checkbox"> Hidden costs</label>
            <label><input id="v-wear" type="checkbox"> Worn land</label>
          </div>
        </details>
      </div>
      <button id="feedtoggle" type="button" aria-pressed="true">Feed</button>
    </div>
  </header>

  <div id="main">
    <div id="mapcol">
      <div id="mapbox">
        <canvas id="map" tabindex="0" aria-label="The map. Drag to pan, scroll to zoom; arrow keys pan, plus and minus zoom, 0 fits."></canvas>
        <div id="zoom" role="group" aria-label="Zoom">
          <button id="zin" type="button" aria-label="Zoom in">+</button>
          <button id="zout" type="button" aria-label="Zoom out">−</button>
          <button id="fit" type="button" aria-label="Fit the map to the window">fit</button>
        </div>
        <p id="error" role="alert"></p>
        <details id="legend" open>
          <summary>Legend</summary>
          <div class="items" id="legenditems"></div>
        </details>
        <button id="showfeed" type="button" hidden>Show feed</button>
        <div id="pick" role="dialog" aria-label="Choose your civ" hidden></div>
        <div id="tip" role="tooltip" hidden></div>
      </div>
      <div id="detail"></div>
    </div>
    <aside id="side" aria-label="Details and events">
      <div id="feedhead"><h2>Events</h2><button id="hidefeed" type="button" aria-label="Collapse the feed">×</button></div>
      <details id="filterbox"><summary>Filter</summary><div id="filters"></div></details>
      <ul id="alerts" aria-label="Alerts, newest first" hidden></ul>
      <ul id="feed" aria-label="Events, newest first"></ul>
    </aside>
  </div>
</section>

<section id="screen-end" data-screen="end" aria-label="Standing over the game" hidden>
  <h1 id="end-head"></h1>
  <p id="end-line"></p>
  <div id="end-chart"></div>
  <div id="end-buttons">
    <button id="end-playon" type="button">Play on</button>
    <button id="end-new" type="button">New game</button>
  </div>
</section>

<script type="module" src="main.js"></script>
</body>
</html>
