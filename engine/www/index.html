<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sans Fiat — barter engine</title>
<style>
  :root { --bg:#12161c; --panel:#1a2029; --ink:#e6edf3; --dim:#8b98a8; --line:#2a3340; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,sans-serif; display:flex; gap:12px; padding:12px; flex-wrap:wrap; align-items:flex-start; }
  canvas { background:#0b0e12; border:1px solid var(--line); border-radius:6px; max-width:100%; }
  #side { width:400px; max-width:100%; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; }
  h1 { font-size:16px; margin:0 0 8px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  label { color:var(--dim); font-size:12px; }
  input { width:52px; background:#0b0e12; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:3px; }
  button { background:#24303d; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:4px 10px; cursor:pointer; }
  table { border-collapse:collapse; width:100%; margin:6px 0; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:2px 4px; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:normal; font-size:12px; }
  .dim { color:var(--dim); font-size:12px; }
  #chart { width:100%; height:140px; }
</style>
</head>
<body>
<canvas id="map" width="720" height="640"></canvas>
<div id="side">
  <h1>Sans Fiat — barter engine</h1>
  <div class="row">
    <label>seed <input id="seed" type="number" value="1"></label>
    <label>clans <input id="clans" type="number" value="40"></label>
    <label>markets <input id="markets" type="number" value="3"></label>
    <label>reach <input id="reach" type="number" value="4"></label>
    <button id="reset">New</button>
  </div>
  <div class="row">
    <button id="step">Step</button>
    <button id="ten">+10</button>
    <button id="play">Play</button>
  </div>
  <div id="info"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
